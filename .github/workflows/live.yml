name: Game night (live)

# Polls every 2 minutes while games are on and posts each game's carousel as soon as it's
# final (typically 5-10 minutes after the horn). When the slate is done it also builds the
# night's Reels (scheduled in Buffer for 11:30 AM ET the next morning).
on:
  schedule:
    # Hourly from 11:10 AM to 2:10 AM ET (EDT). GitHub can start scheduled runs late or skip
    # them, so every hour is a backup for the last; extra runs queue behind the active one
    # (concurrency below) and exit within a minute when there's nothing to post. A run that
    # starts before puck drop waits for the games, and one that runs out of time with games
    # still to post starts the next run itself, so one run that fires carries the whole night.
    - cron: "10 15-23 * * *"
    - cron: "10 0-6 * * *"
  workflow_dispatch:

concurrency:
  group: game-night
  cancel-in-progress: false

permissions:
  contents: write   # state + previews branches
  actions: write    # chain a follow-on run when this one runs out of time

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Watch games and post
        env:
          POST_MODE: ${{ vars.POST_MODE || 'preview' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_HANDLE: ${{ vars.IG_HANDLE || '@chirpanalytics' }}
          SUPABASE_URL: https://cxmkjvnrovgkeslypmix.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python main.py live --max-runtime 5.6
      - name: Chain the next run if games are still to come
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f continue-live ]; then
            gh workflow run live.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
            echo "Started a follow-on run"
          fi
