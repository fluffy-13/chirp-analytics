name: Season research (dev)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "From YYYY-MM-DD"
        default: "2026-09-25"
      end:
        description: "To YYYY-MM-DD"
        required: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/season_report.py "${{ inputs.start }}" "${{ inputs.end }}" /tmp/season.json
      - name: Save to the fixtures branch
        run: |
          python - <<'PY'
          from git_store import GitBranchStore
          GitBranchStore("fixtures").write({"research/season.json": open("/tmp/season.json", "rb").read()},
                                           "Season research")
          PY
