name: Backfill season ledger

on:
  workflow_dispatch:
    inputs:
      start:
        description: "From YYYY-MM-DD"
        default: "2026-09-25"
      end:
        description: "To YYYY-MM-DD"
        required: true

concurrency:
  group: ledger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/build_ledger.py "${{ inputs.start }}" "${{ inputs.end }}"
