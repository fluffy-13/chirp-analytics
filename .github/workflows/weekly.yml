name: Weekly report

on:
  schedule:
    - cron: "40 13 * * 1"   # Mondays 09:40 ET (EDT) — the Monday-Sunday week just ended
  workflow_dispatch:

concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and post the weekly report
        env:
          POST_MODE: ${{ vars.POST_MODE || 'preview' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_HANDLE: ${{ vars.IG_HANDLE || '@chirpanalytics' }}
          SUPABASE_URL: https://cxmkjvnrovgkeslypmix.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python main.py weekly
