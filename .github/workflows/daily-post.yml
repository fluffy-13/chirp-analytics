name: Daily NHL spotlight

on:
  schedule:
    - cron: "5 13 * * *"   # 9:05 ET during daylight time (8:05 ET in winter)
  workflow_dispatch:
    inputs:
      date:
        description: "Game night YYYY-MM-DD (blank = yesterday)"
        required: false
      publish:
        description: "Post to Instagram"
        type: boolean
        default: false

permissions:
  contents: write   # to commit state/posted.json so games are never posted twice

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_HANDLE: ${{ vars.IG_HANDLE || '@chirpanalytics' }}
          SUPABASE_URL: https://cxmkjvnrovgkeslypmix.supabase.co   # watcher-collection project, ig-posts bucket
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          # Scheduled runs publish only once the repo variable PUBLISH_ENABLED is "true"
          # (until then they are dry runs). Manual runs publish only when the box is ticked.
          if { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ vars.PUBLISH_ENABLED }}" = "true" ]; } \
             || [ "${{ inputs.publish }}" = "true" ]; then ARGS="$ARGS --publish"; fi
          python main.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-${{ github.run_id }}
          path: output_posts/
      - name: Save posted state
        run: |
          git config user.name "nhl-bot"
          git config user.email "nhl-bot@users.noreply.github.com"
          git add state/posted.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "Record posted game" && git push)
      - name: Push preview to the previews branch
        if: always()
        run: |
          shopt -s nullglob
          files=(output_posts/*)
          if [ ${#files[@]} -eq 0 ]; then echo "no card this run"; exit 0; fi
          mkdir -p /tmp/preview && cp output_posts/* /tmp/preview/
          {
            echo "# Latest card — run ${{ github.run_id }} ($(date -u +%Y-%m-%dT%H:%MZ))"
            for f in /tmp/preview/*.jpg; do echo "![card]($(basename "$f"))"; done
            echo; echo '```'; cat /tmp/preview/*.txt; echo '```'
          } > /tmp/preview/README.md
          git checkout -q --orphan previews-tmp
          git rm -rqf .
          cp /tmp/preview/* .
          git add -A
          git -c user.name="nhl-bot" -c user.email="nhl-bot@users.noreply.github.com" commit -qm "Preview from run ${{ github.run_id }}"
          git push -qf origin HEAD:previews
