name: Feature posts

# Fantasy pickups Sunday 6:50 PM ET, rookie watch every other Wednesday 11:40 AM ET (the job
# runs weekly and skips the off week), awards race on the 1st of each month 10:40 AM ET,
# top lines Thursdays 11:40 AM ET.
on:
  schedule:
    - cron: "50 22 * * 0"   # fantasy
    - cron: "40 15 * * 3"   # rookies (biweekly, decided in code)
    - cron: "40 14 1 * *"   # awards
    - cron: "40 15 * * 4"   # top lines (Thursday)
  workflow_dispatch:
    inputs:
      feature:
        type: choice
        options: [fantasy, rookies, awards, lines]
      mode:
        type: choice
        options: [default, preview, buffer]
        default: preview
      force:
        type: boolean
        default: false

concurrency:
  group: features
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post
        env:
          POST_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode != 'default') && inputs.mode || vars.POST_MODE || 'preview' }}
          IG_HANDLE: ${{ vars.IG_HANDLE || '@chirpanalytics' }}
          SUPABASE_URL: https://cxmkjvnrovgkeslypmix.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          case "${{ github.event.schedule }}" in
            "50 22 * * 0") FEATURE=fantasy ;;
            "40 15 * * 3") FEATURE=rookies ;;
            "40 14 1 * *") FEATURE=awards ;;
            "40 15 * * 4") FEATURE=lines ;;
            *) FEATURE="${{ inputs.feature }}" ;;
          esac
          ARGS="$FEATURE"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          python main.py $ARGS
